<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>コール練習 - Fanchant Trainer</title>
<style>
  :root{
    --bg: #0a0a12;
    --bg2: #12121e;
    --panel: #16162466;
    --line: #2a2a3d;
    --ink: #f1eef7;
    --ink-dim: #9a95b0;
    --accent: #ff3d7e;   /* penlight magenta */
    --accent2: #37e6ff;  /* penlight cyan */
    --gold: #ffd23d;     /* perfect flash */
    --miss: #5b5468;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; margin:0; overscroll-behavior:none; }
  body{
    background:
      radial-gradient(circle at 20% 0%, #221530 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #0d2430 0%, transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    user-select:none;
  }
  #app{ flex:1; display:flex; flex-direction:column; max-width:480px; margin:0 auto; width:100%; min-height:100vh; }

  /* header */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 10px;
  }
  .brand{
    font-weight:800; letter-spacing:.02em; font-size:15px; text-transform:uppercase;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .backbtn{
    background:none;border:1px solid var(--line);color:var(--ink-dim);
    border-radius:20px; padding:6px 14px; font-size:12px; font-family:var(--sans);
  }
  .backbtn:active{ background:#ffffff10; }

  /* screens */
  .screen{ display:none; flex:1; flex-direction:column; padding:0 18px 24px; }
  .screen.active{ display:flex; }

  h1.hero{
    font-size:28px; line-height:1.25; font-weight:800; margin:6px 0 4px;
    letter-spacing:-0.01em;
  }
  h1.hero em{ font-style:normal; color:var(--accent2); }
  .sub{ color:var(--ink-dim); font-size:13.5px; line-height:1.6; margin:0 0 20px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; color:var(--ink-dim); margin-bottom:6px; letter-spacing:.03em; text-transform:uppercase; }
  .field input[type=text]{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:#ffffff08; color:var(--ink); font-size:15px; font-family:var(--sans);
  }
  .field input[type=text]:focus{ outline:none; border-color:var(--accent2); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:14px; padding:14px 18px; font-size:15px; font-weight:700;
    font-family:var(--sans); cursor:pointer; width:100%;
  }
  .btn-primary{ background:linear-gradient(90deg,var(--accent),#ff6b6b); color:#100; color:#160013; }
  .btn-ghost{ background:#ffffff0d; color:var(--ink); border:1px solid var(--line); }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.4; }

  .divider{ display:flex; align-items:center; gap:10px; color:var(--ink-dim); font-size:11px; margin:22px 0 14px; letter-spacing:.08em; }
  .divider::before,.divider::after{ content:''; flex:1; height:1px; background:var(--line); }

  .chartlist{ display:flex; flex-direction:column; gap:10px; }
  .chart-card{
    display:flex; align-items:center; gap:12px; padding:10px; border-radius:14px;
    border:1px solid var(--line); background:#ffffff06;
  }
  .chart-card img{ width:64px; height:36px; object-fit:cover; border-radius:6px; flex-shrink:0; background:#000;}
  .chart-meta{ flex:1; min-width:0; }
  .chart-meta .name{ font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chart-meta .info{ font-size:11.5px; color:var(--ink-dim); font-family:var(--mono); margin-top:2px; }
  .chart-actions{ display:flex; gap:6px; flex-shrink:0; }
  .iconbtn{
    background:#ffffff0f; border:1px solid var(--line); color:var(--ink); border-radius:10px;
    width:38px; height:38px; font-size:15px; display:flex; align-items:center; justify-content:center;
  }
  .iconbtn.danger{ color:#ff8fa8; }
  .empty{ text-align:center; color:var(--ink-dim); font-size:13px; padding:30px 10px; border:1px dashed var(--line); border-radius:14px; }

  /* player area, shared, shown/hidden via css only (never removed) */
  #media-slot{ display:none; padding:0 0 6px; }
  #media-slot.show{ display:block; }
  .player-frame{
    position:relative; width:100%; aspect-ratio:16/9; border-radius:14px; overflow:hidden;
    background:#000; border:1px solid var(--line);
  }
  #yt-player{ position:absolute; inset:0; width:100%; height:100%; }

  .transport{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .transport .iconbtn{ flex-shrink:0; }
  .rate-select{
    background:#ffffff0f; border:1px solid var(--line); color:var(--ink); border-radius:10px;
    padding:0 10px; height:38px; font-family:var(--mono); font-size:13px;
  }

  /* editor */
  .tapzone{
    margin-top:16px; height:130px; border-radius:18px;
    background:radial-gradient(circle at center, #ff3d7e22, transparent 70%), #ffffff06;
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px;
    font-weight:800; font-size:17px;
  }
  .tapzone .cnt{ font-family:var(--mono); font-size:13px; color:var(--accent2); font-weight:400; }
  .tapzone.flash{ animation: flashpulse .18s ease-out; }
  @keyframes flashpulse{ 0%{ background:#ff3d7e55; } 100%{ background:radial-gradient(circle at center, #ff3d7e22, transparent 70%), #ffffff06; } }

  .cuelog{ margin-top:14px; max-height:150px; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:6px; }
  .cuelog-row{
    display:flex; align-items:center; justify-content:space-between;
    background:#ffffff06; border:1px solid var(--line); border-radius:10px; padding:8px 12px;
    font-family:var(--mono); font-size:12.5px;
  }
  .cuelog-row button{ background:none; border:none; color:#ff8fa8; font-size:14px; }
  .editor-savebar{ margin-top:16px; display:flex; gap:8px; }

  /* game screen */
  .hud{ display:flex; justify-content:space-between; align-items:flex-end; margin:10px 0 6px; }
  .hud .score{ font-family:var(--mono); font-size:26px; font-weight:700; letter-spacing:-0.02em; }
  .hud .combo{ font-family:var(--mono); font-size:13px; color:var(--gold); text-align:right; }
  .hud .combo b{ font-size:18px; }

  .lane{
    position:relative; flex:1; min-height:280px; margin-top:8px; border-radius:18px;
    background:linear-gradient(180deg, #0d0d17 0%, #131324 80%, #1a1a2e 100%);
    border:1px solid var(--line); overflow:hidden;
  }
  .hitline{
    position:absolute; left:0; right:0; top:82%; height:2px;
    background:linear-gradient(90deg, transparent, var(--accent2), transparent);
  }
  .hitline::after{
    content:''; position:absolute; left:50%; top:50%; width:64px; height:64px;
    border:2px solid var(--accent2); border-radius:50%; transform:translate(-50%,-50%);
    box-shadow:0 0 18px #37e6ff55;
  }
  .note{
    position:absolute; left:50%; width:64px; height:64px; margin-left:-32px; top:0%;
    border:3px solid var(--accent); border-radius:50%; transform:translateY(-50%) scale(1.8);
    display:flex; align-items:center; justify-content:center; opacity:0;
    font-size:11px; font-weight:700; color:var(--ink); font-family:var(--mono);
    transition: opacity .1s linear;
    pointer-events:none;
  }
  .note.visible{ opacity:1; }
  .note.judge-perfect{ border-color:var(--gold); box-shadow:0 0 22px #ffd23daa; transition:all .22s ease-out; transform:translateY(-50%) scale(2.6); opacity:0; }
  .note.judge-good{ border-color:var(--accent2); box-shadow:0 0 18px #37e6ffaa; transition:all .22s ease-out; transform:translateY(-50%) scale(2.4); opacity:0; }
  .note.judge-bad{ border-color:var(--miss); transition:all .22s ease-out; transform:translateY(-50%) scale(1.4); opacity:0; }
  .note.judge-miss{ border-color:#ff3d3d; transition:all .3s ease-out; transform:translateY(-50%) translateY(20px) scale(1.2); opacity:0; }

  .callout{
    position:absolute; left:0; right:0; top:14px; text-align:center; font-weight:800;
    font-size:22px; letter-spacing:.05em; opacity:0; pointer-events:none;
  }
  .callout.show{ animation:calloutpop .5s ease-out; }
  @keyframes calloutpop{ 0%{ opacity:0; transform:translateY(6px) scale(.9); } 25%{ opacity:1; transform:translateY(0) scale(1.05);} 100%{ opacity:0; transform:translateY(-6px) scale(1);} }
  .callout.c-perfect{ color:var(--gold); text-shadow:0 0 14px #ffd23d99; }
  .callout.c-good{ color:var(--accent2); text-shadow:0 0 14px #37e6ff99; }
  .callout.c-bad{ color:var(--ink-dim); }
  .callout.c-miss{ color:#ff5d7e; }

  .pushbtn{
    margin-top:12px; height:76px; border-radius:20px; font-size:18px; font-weight:800;
    background:linear-gradient(90deg,var(--accent),#ff6b6b); color:#160013; border:none;
    letter-spacing:.04em;
  }
  .pushbtn:active{ filter:brightness(.85); }

  .startoverlay{
    position:absolute; inset:0; background:#0a0a12dd; display:flex; align-items:center;
    justify-content:center; flex-direction:column; gap:14px; z-index:5;
  }
  .startoverlay h2{ font-size:18px; margin:0; }
  .startoverlay .bigbtn{
    width:110px;height:110px;border-radius:50%; border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#160013;
    font-size:16px; font-weight:800;
  }

  /* result */
  .rank{ text-align:center; margin:14px 0 4px; }
  .rank .letter{
    font-size:76px; font-weight:800; font-family:var(--mono); line-height:1;
    background:linear-gradient(90deg,var(--accent2),var(--accent)); -webkit-background-clip:text;
    background-clip:text; color:transparent;
  }
  .rank .pct{ color:var(--ink-dim); font-family:var(--mono); font-size:14px; }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:22px 0; }
  .stat{ background:#ffffff06; border:1px solid var(--line); border-radius:14px; padding:14px; }
  .stat .k{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em; }
  .stat .v{ font-family:var(--mono); font-size:22px; font-weight:700; margin-top:4px; }
  .stat.perfect .v{ color:var(--gold); }
  .stat.good .v{ color:var(--accent2); }
  .stat.miss .v{ color:#ff5d7e; }
  .result-actions{ display:flex; flex-direction:column; gap:10px; margin-top:auto; }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:#1c1c2c; border:1px solid var(--line); color:var(--ink); padding:10px 18px;
    border-radius:20px; font-size:13px; z-index:50; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .spinner{ width:16px;height:16px;border-radius:50%;border:2px solid #ffffff33;border-top-color:var(--accent2); animation:spin .7s linear infinite; display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand">Fanchant Trainer</div>
    <button class="backbtn" id="btn-home-nav" style="display:none;">← ホーム</button>
  </div>

  <!-- persistent player mount: never removed from DOM, only shown/hidden -->
  <div id="media-slot">
    <div class="player-frame"><div id="yt-player"></div></div>
  </div>

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <h1 class="hero">推しの<em>掛け声</em>を、<br>指に覚えさせる。</h1>
    <p class="sub">YouTubeの動画を見ながら実際の掛け声のタイミングをタップして記録し、リズムゲーム形式で覚えられるまで練習します。ライブ前の予習にどうぞ。</p>

    <div class="field">
      <label>YouTube動画URL</label>
      <input type="text" id="input-url" placeholder="https://www.youtube.com/watch?v=... または youtu.be/...">
    </div>
    <button class="btn btn-primary" id="btn-new-chart">この動画で新しいコール表を作る</button>

    <div class="divider">保存済みのコール表</div>
    <div class="chartlist" id="chartlist"></div>
  </div>

  <!-- EDITOR -->
  <div class="screen" id="screen-editor">
    <div class="field">
      <label>コール表の名前</label>
      <input type="text" id="editor-name" placeholder="例：曲名 サビ応援">
    </div>
    <div class="field">
      <label>参考リンク（任意）</label>
      <input type="text" id="editor-ref" placeholder="公式サイトの応援方法ページなど">
    </div>

    <div class="transport">
      <button class="iconbtn" id="editor-playpause">▶</button>
      <button class="iconbtn" id="editor-back3">-3s</button>
      <select class="rate-select" id="editor-rate">
        <option value="1">1.0x</option>
        <option value="0.75">0.75x</option>
        <option value="0.5">0.5x</option>
      </select>
    </div>

    <div class="tapzone" id="editor-tap">
      <div>タップして掛け声を登録</div>
      <div class="cnt" id="editor-count">0件 記録済み</div>
    </div>

    <div style="display:flex; gap:8px; margin-top:10px;">
      <button class="btn btn-ghost" id="editor-undo" style="flex:1;">直前を取り消す</button>
    </div>

    <div class="cuelog" id="editor-log"></div>

    <div class="editor-savebar">
      <button class="btn btn-ghost" id="editor-cancel" style="flex:1;">キャンセル</button>
      <button class="btn btn-primary" id="editor-save" style="flex:1;">保存する</button>
    </div>
  </div>

  <!-- PLAY -->
  <div class="screen" id="screen-play">
    <div class="hud">
      <div class="score" id="play-score">0</div>
      <div class="combo">COMBO<br><b id="play-combo">0</b></div>
    </div>
    <div class="lane" id="lane">
      <div class="hitline"></div>
      <div class="callout" id="callout"></div>
      <div class="startoverlay" id="startoverlay">
        <h2 id="play-title-name">-</h2>
        <button class="bigbtn" id="btn-start-play">START</button>
        <div style="color:var(--ink-dim); font-size:12px;">タイミングよく下のボタンを押そう</div>
      </div>
    </div>
    <button class="pushbtn" id="pushbtn">PUSH!</button>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div class="rank">
      <div class="letter" id="result-rank">-</div>
      <div class="pct" id="result-pct">-</div>
    </div>
    <div class="stat-grid">
      <div class="stat perfect"><div class="k">Perfect</div><div class="v" id="r-perfect">0</div></div>
      <div class="stat good"><div class="k">Good</div><div class="v" id="r-good">0</div></div>
      <div class="stat"><div class="k">Bad</div><div class="v" id="r-bad">0</div></div>
      <div class="stat miss"><div class="k">Miss</div><div class="v" id="r-miss">0</div></div>
    </div>
    <div class="stat" style="text-align:center;"><div class="k">Max Combo</div><div class="v" id="r-combo">0</div></div>
    <div class="result-actions">
      <button class="btn btn-primary" id="btn-retry">もう一度プレイ</button>
      <button class="btn btn-ghost" id="btn-result-home">ホームに戻る</button>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------- state ---------- */
  const S = {
    screen: 'home',
    ytReady: false,
    ytPlayer: null,
    pendingPlayerAction: null,
    editor: { videoId:null, cues:[], playing:false },
    game: { chart:null, cues:[], idx:0, running:false, rafId:null, score:0, combo:0, maxCombo:0,
            counts:{perfect:0, good:0, bad:0, miss:0}, noteEls:[] },
  };
  const LEAD = 2.0, W_PERFECT = 0.15, W_GOOD = 0.35, W_BAD = 0.6;

  /* ---------- helpers ---------- */
  function $(id){ return document.getElementById(id); }
  function fmtTime(s){
    if (s==null || isNaN(s)) return '0:00.0';
    const m = Math.floor(s/60), r = (s - m*60).toFixed(1);
    return m + ':' + (r.length<4?'0':'') + r;
  }
  function extractVideoId(url){
    if(!url) return null;
    url = url.trim();
    let m = url.match(/[?&]v=([A-Za-z0-9_-]{11})/); if(m) return m[1];
    m = url.match(/youtu\.be\/([A-Za-z0-9_-]{11})/); if(m) return m[1];
    m = url.match(/\/embed\/([A-Za-z0-9_-]{11})/); if(m) return m[1];
    if(/^[A-Za-z0-9_-]{11}$/.test(url)) return url;
    return null;
  }
  let toastTimer=null;
  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
  }
  function showScreen(name){
    document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
    $('screen-'+name).classList.add('active');
    S.screen = name;
    $('btn-home-nav').style.display = name==='home' ? 'none' : 'inline-flex';
    const slot = $('media-slot');
    if(name==='editor' || name==='play'){ slot.classList.add('show'); }
    else { slot.classList.remove('show'); }
  }

  /* ---------- storage (localStorage: works once hosted as a real site) ---------- */
  async function loadIndex(){
    try{
      const v = localStorage.getItem('fct-charts-index');
      return v ? JSON.parse(v) : [];
    }catch(e){ return []; }
  }
  async function saveIndex(list){
    try{ localStorage.setItem('fct-charts-index', JSON.stringify(list)); }
    catch(e){ toast('保存に失敗しました'); }
  }
  async function loadChart(id){
    try{
      const v = localStorage.getItem('fct-chart-'+id);
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  }
  async function saveChart(chart){
    try{
      localStorage.setItem('fct-chart-'+chart.id, JSON.stringify(chart));
      return true;
    }catch(e){ toast('保存に失敗しました'); return false; }
  }
  async function deleteChart(id){
    try{ localStorage.removeItem('fct-chart-'+id); }catch(e){}
    const idx = await loadIndex();
    await saveIndex(idx.filter(c=>c.id!==id));
  }

  /* ---------- youtube iframe api ---------- */
  window.onYouTubeIframeAPIReady = function(){
    S.ytPlayer = new YT.Player('yt-player', {
      height:'100%', width:'100%', videoId:'',
      playerVars:{ playsinline:1, rel:0, modestbranding:1, controls:1, origin: window.location.origin || undefined },
      events:{
        onReady: function(){
          S.ytReady = true;
          if (S.pendingPlayerAction){ S.pendingPlayerAction(); S.pendingPlayerAction = null; }
        },
        onStateChange: function(ev){
          if (ev.data === YT.PlayerState.ENDED){
            if (S.screen==='play' && S.game.running) finishGame();
          }
        }
      }
    });
  };
  (function loadYT(){
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  })();
  function withPlayer(fn){
    if (S.ytReady) fn(); else S.pendingPlayerAction = fn;
  }

  /* ---------- home screen ---------- */
  async function renderChartList(){
    const list = await loadIndex();
    const el = $('chartlist');
    if (!list.length){ el.innerHTML = '<div class="empty">まだコール表がありません。<br>上のURLを入力して作成しましょう。</div>'; return; }
    list.sort((a,b)=> b.createdAt - a.createdAt);
    el.innerHTML = '';
    list.forEach(c=>{
      const row = document.createElement('div');
      row.className = 'chart-card';
      row.innerHTML =
        '<img src="https://i.ytimg.com/vi/'+c.videoId+'/mqdefault.jpg" alt="">' +
        '<div class="chart-meta"><div class="name"></div><div class="info"></div></div>' +
        '<div class="chart-actions">' +
          (c.refUrl ? '<button class="iconbtn ref-b" title="参考リンクを開く">🔗</button>' : '') +
          '<button class="iconbtn play-b" title="プレイ">▶</button>' +
          '<button class="iconbtn danger del-b" title="削除">✕</button>' +
        '</div>';
      row.querySelector('.name').textContent = c.name;
      row.querySelector('.info').textContent = c.cueCount + '件のコール';
      row.querySelector('.play-b').addEventListener('click', ()=> startPlayFlow(c.id));
      const refBtn = row.querySelector('.ref-b');
      if (refBtn) refBtn.addEventListener('click', ()=> window.open(c.refUrl, '_blank', 'noopener'));
      row.querySelector('.del-b').addEventListener('click', async ()=>{
        if (confirm('「'+c.name+'」を削除しますか？')){ await deleteChart(c.id); renderChartList(); }
      });
      el.appendChild(row);
    });
  }

  $('btn-new-chart').addEventListener('click', ()=>{
    const id = extractVideoId($('input-url').value);
    if (!id){ toast('YouTubeのURLを確認してください'); return; }
    openEditor(id);
  });

  $('btn-home-nav').addEventListener('click', ()=>{
    stopEditorPlayback();
    stopGameLoop();
    showScreen('home');
    renderChartList();
  });

  /* ---------- editor ---------- */
  function openEditor(videoId){
    S.editor.videoId = videoId;
    S.editor.cues = [];
    S.editor.playing = false;
    $('editor-name').value = '';
    $('editor-ref').value = '';
    $('editor-rate').value = '1';
    renderEditorLog();
    showScreen('editor');
    withPlayer(()=>{
      S.ytPlayer.loadVideoById(videoId);
      S.ytPlayer.pauseVideo();
      S.ytPlayer.setPlaybackRate(1);
    });
    $('editor-playpause').textContent = '▶';
  }
  function stopEditorPlayback(){
    if (S.ytReady && S.ytPlayer && S.ytPlayer.pauseVideo){ try{ S.ytPlayer.pauseVideo(); }catch(e){} }
  }
  $('editor-playpause').addEventListener('click', ()=>{
    withPlayer(()=>{
      if (S.editor.playing){ S.ytPlayer.pauseVideo(); S.editor.playing=false; $('editor-playpause').textContent='▶'; }
      else{ S.ytPlayer.playVideo(); S.editor.playing=true; $('editor-playpause').textContent='❚❚'; }
    });
  });
  $('editor-back3').addEventListener('click', ()=>{
    withPlayer(()=>{
      const t = Math.max(0, S.ytPlayer.getCurrentTime()-3);
      S.ytPlayer.seekTo(t, true);
    });
  });
  $('editor-rate').addEventListener('change', (e)=>{
    withPlayer(()=> S.ytPlayer.setPlaybackRate(parseFloat(e.target.value)));
  });
  $('editor-tap').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    if (!S.ytReady || !S.editor.playing) { toast('再生してからタップしてください'); return; }
    const t = S.ytPlayer.getCurrentTime();
    S.editor.cues.push(t);
    const zone = $('editor-tap');
    zone.classList.remove('flash'); void zone.offsetWidth; zone.classList.add('flash');
    renderEditorLog();
  });
  $('editor-undo').addEventListener('click', ()=>{
    S.editor.cues.pop();
    renderEditorLog();
  });
  function renderEditorLog(){
    $('editor-count').textContent = S.editor.cues.length + '件 記録済み';
    const log = $('editor-log');
    log.innerHTML = '';
    S.editor.cues.forEach((t, i)=>{
      const row = document.createElement('div');
      row.className = 'cuelog-row';
      row.innerHTML = '<span>#'+(i+1)+'　'+fmtTime(t)+'</span><button>✕</button>';
      row.querySelector('button').addEventListener('click', ()=>{
        S.editor.cues.splice(i,1); renderEditorLog();
      });
      log.appendChild(row);
    });
  }
  $('editor-cancel').addEventListener('click', ()=>{
    stopEditorPlayback();
    showScreen('home'); renderChartList();
  });
  $('editor-save').addEventListener('click', async ()=>{
    const name = $('editor-name').value.trim();
    if (!name){ toast('コール表の名前を入力してください'); return; }
    if (S.editor.cues.length < 1){ toast('コールを1件以上記録してください'); return; }
    stopEditorPlayback();
    const cues = S.editor.cues.slice().sort((a,b)=>a-b);
    const refUrl = $('editor-ref').value.trim();
    const chart = {
      id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      name, videoId: S.editor.videoId, cues, refUrl, createdAt: Date.now()
    };
    const ok = await saveChart(chart);
    if (!ok) return;
    const idx = await loadIndex();
    idx.push({ id:chart.id, name:chart.name, videoId:chart.videoId, cueCount:cues.length, refUrl, createdAt:chart.createdAt });
    await saveIndex(idx);
    toast('保存しました');
    showScreen('home'); renderChartList();
  });

  /* ---------- play (game) ---------- */
  async function startPlayFlow(chartId){
    const chart = await loadChart(chartId);
    if (!chart){ toast('コール表が読み込めませんでした'); return; }
    S.game.chart = chart;
    S.game.cues = chart.cues.map(t=>({time:t, judged:false, el:null}));
    S.game.idx = 0; S.game.score = 0; S.game.combo = 0; S.game.maxCombo = 0;
    S.game.counts = {perfect:0, good:0, bad:0, miss:0};
    S.game.running = false;
    $('play-title-name').textContent = chart.name;
    $('play-score').textContent = '0';
    $('play-combo').textContent = '0';
    $('startoverlay').style.display = 'flex';
    // build note elements
    const lane = $('lane');
    lane.querySelectorAll('.note').forEach(n=>n.remove());
    S.game.cues.forEach((cue, i)=>{
      const el = document.createElement('div');
      el.className = 'note';
      lane.appendChild(el);
      cue.el = el;
    });
    showScreen('play');
    withPlayer(()=>{
      S.ytPlayer.loadVideoById(chart.videoId);
      S.ytPlayer.pauseVideo();
    });
  }
  $('btn-start-play').addEventListener('click', ()=>{
    $('startoverlay').style.display = 'none';
    withPlayer(()=>{
      S.ytPlayer.seekTo(0, true);
      S.ytPlayer.playVideo();
      S.game.running = true;
      runGameLoop();
    });
  });
  function showCallout(text, cls){
    const c = $('callout');
    c.textContent = text; c.className = 'callout show ' + cls;
    void c.offsetWidth;
  }
  function judgeCue(cue, pressTime){
    if (cue.judged) return;
    cue.judged = true;
    let cls, label;
    if (pressTime === null){
      cls='judge-miss'; label='MISS'; S.game.counts.miss++; S.game.combo=0;
    } else {
      const d = Math.abs(pressTime - cue.time);
      if (d<=W_PERFECT){ cls='judge-perfect'; label='PERFECT'; S.game.score+=100; S.game.combo++; S.game.counts.perfect++; }
      else if (d<=W_GOOD){ cls='judge-good'; label='GOOD'; S.game.score+=50; S.game.combo++; S.game.counts.good++; }
      else { cls='judge-bad'; label='BAD'; S.game.score+=10; S.game.combo=0; S.game.counts.bad++; }
    }
    S.game.maxCombo = Math.max(S.game.maxCombo, S.game.combo);
    cue.el.classList.add(cls);
    showCallout(label, cls.replace('judge-','c-'));
    $('play-score').textContent = S.game.score;
    $('play-combo').textContent = S.game.combo;
  }
  function runGameLoop(){
    function tick(){
      if (!S.game.running) return;
      const t = S.ytPlayer.getCurrentTime ? S.ytPlayer.getCurrentTime() : 0;
      S.game.cues.forEach(cue=>{
        if (cue.judged) return;
        const dt = cue.time - t;
        if (dt > LEAD){ cue.el.classList.remove('visible'); return; }
        if (dt < -W_BAD - 0.3){ judgeCue(cue, null); return; }
        cue.el.classList.add('visible');
        const progress = 1 - (dt/LEAD);
        const topPct = Math.min(progress, 1.15) * 82;
        cue.el.style.top = topPct + '%';
      });
      const allDone = S.game.cues.every(c=>c.judged);
      if (allDone){ finishGame(); return; }
      S.game.rafId = requestAnimationFrame(tick);
    }
    S.game.rafId = requestAnimationFrame(tick);
  }
  function stopGameLoop(){
    S.game.running = false;
    if (S.game.rafId) cancelAnimationFrame(S.game.rafId);
    if (S.ytReady && S.ytPlayer && S.ytPlayer.pauseVideo){ try{ S.ytPlayer.pauseVideo(); }catch(e){} }
  }
  function pressHit(){
    if (!S.game.running) return;
    const t = S.ytPlayer.getCurrentTime();
    let best=null, bestDelta=Infinity;
    S.game.cues.forEach(cue=>{
      if (cue.judged) return;
      const d = Math.abs(cue.time - t);
      if (d<bestDelta){ bestDelta=d; best=cue; }
    });
    if (best && bestDelta<=W_BAD){ judgeCue(best, t); }
    else { showCallout('...', 'c-bad'); }
  }
  $('pushbtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); pressHit(); });
  window.addEventListener('keydown', (e)=>{
    if (e.code==='Space' && S.screen==='play' && S.game.running){ e.preventDefault(); pressHit(); }
  });
  function finishGame(){
    stopGameLoop();
    const total = S.game.cues.length;
    const maxScore = total*100;
    const pct = maxScore>0 ? Math.round((S.game.score/maxScore)*1000)/10 : 0;
    let rank='C';
    if (pct>=98) rank='S'; else if (pct>=90) rank='A'; else if (pct>=75) rank='B';
    $('result-rank').textContent = rank;
    $('result-pct').textContent = pct + '%  ('+S.game.score+' / '+maxScore+')';
    $('r-perfect').textContent = S.game.counts.perfect;
    $('r-good').textContent = S.game.counts.good;
    $('r-bad').textContent = S.game.counts.bad;
    $('r-miss').textContent = S.game.counts.miss;
    $('r-combo').textContent = S.game.maxCombo;
    showScreen('result');
  }
  $('btn-retry').addEventListener('click', ()=>{ startPlayFlow(S.game.chart.id); });
  $('btn-result-home').addEventListener('click', ()=>{ showScreen('home'); renderChartList(); });

  /* ---------- init ---------- */
  renderChartList();
})();
</script>
</body>
</html>
