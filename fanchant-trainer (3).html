<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>コール練習 - Cheer Up!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-a: #ffe1ef;
    --bg-b: #fff3c9;
    --bg-c: #d9f3ff;
    --panel: #ffffff;
    --line: #ffd1e6;
    --ink: #5c4360;
    --ink-dim: #a68aa8;
    --pink: #ff6fa8;
    --pink-deep: #ff3d8a;
    --yellow: #ffce3d;
    --sky: #4fc9ff;
    --mint: #46e0b0;
    --grape: #b07cff;
    --mono: 'M PLUS Rounded 1c', var(--sans);
    --sans: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    --pop: 'Mochiy Pop One', var(--sans);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; margin:0; overscroll-behavior:none; }
  body{
    background:
      radial-gradient(circle at 15% 5%, var(--bg-c) 0%, transparent 40%),
      radial-gradient(circle at 90% 10%, var(--bg-b) 0%, transparent 45%),
      linear-gradient(160deg, var(--bg-a), var(--bg-b) 60%, var(--bg-c));
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    user-select:none;
  }
  #app{ flex:1; display:flex; flex-direction:column; max-width:480px; margin:0 auto; width:100%; min-height:100vh; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 8px;
  }
  .brand{
    font-family:var(--pop); font-size:14px; letter-spacing:.02em;
    color:var(--pink-deep);
    text-shadow: 1px 1px 0 #fff, 2px 2px 0 #ffd1e6;
  }
  .backbtn{
    background:#fff; border:2px solid var(--line); color:var(--pink-deep);
    border-radius:20px; padding:7px 16px; font-size:12px; font-weight:700; font-family:var(--sans);
    box-shadow:0 3px 0 var(--line);
  }
  .backbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--line); }

  .screen{ display:none; flex:1; flex-direction:column; padding:0 18px 24px; }
  .screen.active{ display:flex; }

  h1.hero{
    font-family:var(--pop); font-size:22px; line-height:1.55; font-weight:400; margin:8px 0 6px;
    color:var(--pink-deep);
  }
  h1.hero em{ font-style:normal; color:var(--sky); }
  .sub{ color:var(--ink-dim); font-size:13px; line-height:1.7; margin:0 0 20px; font-weight:700; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; color:var(--pink-deep); margin-bottom:6px; letter-spacing:.02em; font-weight:800; }
  .field input[type=text]{
    width:100%; padding:13px 14px; border-radius:16px; border:2px solid var(--line);
    background:#fff; color:var(--ink); font-size:15px; font-family:var(--sans); font-weight:700;
  }
  .field input[type=text]:focus{ outline:none; border-color:var(--sky); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:18px; padding:15px 18px; font-size:15px; font-weight:800;
    font-family:var(--sans); cursor:pointer; width:100%;
  }
  .btn-primary{ background:linear-gradient(180deg,#ff9dc2,var(--pink)); color:#fff; box-shadow:0 4px 0 var(--pink-deep); }
  .btn-ghost{ background:#fff; color:var(--pink-deep); border:2px solid var(--line); box-shadow:0 3px 0 var(--line); }
  .btn:active{ transform:translateY(3px); box-shadow:none; }
  .btn:disabled{ opacity:.4; }

  .divider{ display:flex; align-items:center; gap:10px; color:var(--pink-deep); font-size:11px; font-weight:800; margin:22px 0 14px; }
  .divider::before,.divider::after{ content:''; flex:1; height:2px; background:var(--line); border-radius:2px; }

  .chartlist{ display:flex; flex-direction:column; gap:10px; }
  .chart-card{
    display:flex; align-items:center; gap:12px; padding:10px; border-radius:18px;
    border:2px solid var(--line); background:#fff;
    box-shadow:0 3px 0 var(--line);
  }
  .chart-card img{ width:64px; height:36px; object-fit:cover; border-radius:10px; flex-shrink:0; background:#000; border:2px solid var(--line);}
  .chart-meta{ flex:1; min-width:0; }
  .chart-meta .name{ font-weight:800; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chart-meta .info{ font-size:11.5px; color:var(--ink-dim); font-weight:700; margin-top:2px; }
  .chart-actions{ display:flex; gap:6px; flex-shrink:0; }
  .iconbtn{
    background:#fff7fb; border:2px solid var(--line); color:var(--pink-deep); border-radius:12px;
    width:38px; height:38px; font-size:15px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 0 var(--line);
  }
  .iconbtn:active{ transform:translateY(2px); box-shadow:none; }
  .iconbtn.danger{ color:#ff5577; }
  .empty{ text-align:center; color:var(--ink-dim); font-size:13px; font-weight:700; padding:30px 10px; border:2px dashed var(--line); border-radius:18px; background:#ffffffaa; }

  #media-slot{ display:none; padding:0 0 6px; }
  #media-slot.show{ display:block; }
  .player-frame{
    position:relative; width:100%; aspect-ratio:16/9; border-radius:18px; overflow:hidden;
    background:#000; border:3px solid #fff; box-shadow:0 4px 0 var(--line), 0 0 0 5px var(--line);
  }
  #yt-player{ position:absolute; inset:0; width:100%; height:100%; }

  .transport{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .transport .iconbtn{ flex-shrink:0; }
  .rate-select{
    background:#fff7fb; border:2px solid var(--line); color:var(--pink-deep); border-radius:12px;
    padding:0 10px; height:38px; font-family:var(--sans); font-weight:800; font-size:13px;
  }

  .tapzone{
    margin-top:16px; height:130px; border-radius:22px;
    background:linear-gradient(180deg,#fff,#fff0f6);
    border:3px solid var(--pink);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px;
    font-weight:800; font-size:16px; color:var(--pink-deep);
    box-shadow:0 4px 0 var(--pink);
  }
  .tapzone .cnt{ font-family:var(--sans); font-size:12.5px; color:var(--sky); font-weight:700; }
  .tapzone.flash{ animation: flashpulse .18s ease-out; }
  @keyframes flashpulse{ 0%{ background:#ffd1e6; } 100%{ background:linear-gradient(180deg,#fff,#fff0f6); } }

  .cuelog{ margin-top:14px; max-height:150px; overflow-y:auto; display:flex; flex-direction:column-reverse; gap:6px; }
  .cuelog-row{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border:2px solid var(--line); border-radius:14px; padding:8px 12px;
    font-family:var(--sans); font-size:12.5px; font-weight:800; color:var(--ink);
  }
  .cuelog-row button{ background:none; border:none; color:#ff5577; font-size:15px; font-weight:800; }
  .editor-savebar{ margin-top:16px; display:flex; gap:8px; }

  .hud{ display:flex; justify-content:space-between; align-items:flex-end; margin:10px 0 4px; }
  .hud .score{ font-family:var(--pop); font-size:24px; color:var(--pink-deep); }
  .hud .combo{ font-family:var(--sans); font-size:12px; color:var(--yellow); text-align:right; font-weight:800; }
  .hud .combo b{ font-size:19px; -webkit-text-stroke:1px var(--pink-deep); color:var(--yellow); }

  .hud2{ display:flex; justify-content:flex-end; margin-bottom:6px; }
  .blindtoggle{
    background:#fff; border:2px solid var(--line); color:var(--grape); border-radius:20px;
    padding:6px 14px; font-size:11.5px; font-weight:800; box-shadow:0 3px 0 var(--line);
    display:flex; align-items:center; gap:6px;
  }
  .blindtoggle.active{ background:var(--grape); color:#fff; border-color:var(--grape); box-shadow:0 3px 0 #8a5ad6; }
  .blindtoggle:active{ transform:translateY(2px); box-shadow:none; }

  .lane{
    position:relative; flex:1; min-height:280px; margin-top:4px; border-radius:22px;
    background:linear-gradient(180deg, #fff 0%, #fff5fa 60%, #ffe9f4 100%);
    border:3px solid #fff; box-shadow:0 0 0 3px var(--line); overflow:hidden;
  }
  .lane.blind-mode .note{ opacity:0 !important; }
  .hitline{
    position:absolute; left:0; right:0; top:82%; height:3px;
    background:linear-gradient(90deg, transparent, var(--sky), transparent);
    border-radius:3px;
  }
  .hitline::after{
    content:''; position:absolute; left:50%; top:50%; width:66px; height:66px;
    border:4px dashed var(--sky); border-radius:50%; transform:translate(-50%,-50%);
    box-shadow:0 0 0 6px #ffffff, 0 0 16px #4fc9ff55;
  }
  .note{
    position:absolute; left:50%; width:58px; height:58px; margin-left:-29px; top:0%;
    border-radius:50%; transform:translateY(-50%) scale(1.6); opacity:0;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; pointer-events:none;
    background:radial-gradient(circle at 35% 30%, #fff, var(--pink) 70%);
    border:3px solid #fff; box-shadow:0 0 0 3px var(--pink-deep), 0 3px 8px #ff3d8a55;
    transition: opacity .1s linear;
  }
  .note::after{ content:'★'; color:#fff; text-shadow:0 1px 1px #0002; }
  .note.visible{ opacity:1; }
  .note.judge-perfect{ background:radial-gradient(circle at 35% 30%,#fff,var(--yellow) 70%); box-shadow:0 0 0 3px #e8a800, 0 0 22px #ffd23daa; transition:all .22s ease-out; transform:translateY(-50%) scale(2.6); opacity:0; }
  .note.judge-good{ background:radial-gradient(circle at 35% 30%,#fff,var(--sky) 70%); box-shadow:0 0 0 3px #1e9fdc, 0 0 18px #4fc9ffaa; transition:all .22s ease-out; transform:translateY(-50%) scale(2.4); opacity:0; }
  .note.judge-bad{ background:radial-gradient(circle at 35% 30%,#fff,#c9bcd6 70%); transition:all .22s ease-out; transform:translateY(-50%) scale(1.4); opacity:0; }
  .note.judge-miss{ background:radial-gradient(circle at 35% 30%,#fff,#ff8fa8 70%); transition:all .3s ease-out; transform:translateY(-50%) translateY(20px) scale(1.2); opacity:0; }

  .callout{
    position:absolute; left:0; right:0; top:14px; text-align:center; font-family:var(--pop);
    font-size:20px; letter-spacing:.03em; opacity:0; pointer-events:none;
  }
  .callout.show{ animation:calloutpop .5s ease-out; }
  @keyframes calloutpop{ 0%{ opacity:0; transform:translateY(6px) scale(.9); } 25%{ opacity:1; transform:translateY(0) scale(1.08);} 100%{ opacity:0; transform:translateY(-6px) scale(1);} }
  .callout.c-perfect{ color:#e8a800; text-shadow:0 0 10px #ffd23d99, 1px 1px 0 #fff; }
  .callout.c-good{ color:#1e9fdc; text-shadow:0 0 10px #4fc9ff99, 1px 1px 0 #fff; }
  .callout.c-bad{ color:var(--ink-dim); text-shadow:1px 1px 0 #fff; }
  .callout.c-miss{ color:#ff5577; text-shadow:1px 1px 0 #fff; }

  .pushbtn{
    margin-top:12px; height:78px; border-radius:24px; font-family:var(--pop); font-size:19px;
    background:linear-gradient(180deg,#ff9dc2,var(--pink)); color:#fff; border:none;
    letter-spacing:.04em; box-shadow:0 5px 0 var(--pink-deep);
  }
  .pushbtn:active{ transform:translateY(4px); box-shadow:none; }

  .startoverlay{
    position:absolute; inset:0; background:#fff6fbee; display:flex; align-items:center;
    justify-content:center; flex-direction:column; gap:16px; z-index:5;
  }
  .startoverlay h2{ font-family:var(--pop); font-size:16px; margin:0; color:var(--pink-deep); text-align:center; padding:0 20px; }
  .startoverlay .bigbtn{
    width:112px;height:112px;border-radius:50%; border:4px solid #fff;
    background:linear-gradient(135deg,var(--pink),var(--sky)); color:#fff;
    font-family:var(--pop); font-size:16px; box-shadow:0 5px 0 var(--pink-deep);
  }
  .startoverlay .bigbtn:active{ transform:translateY(4px); box-shadow:none; }

  .rank{ text-align:center; margin:14px 0 4px; }
  .rank .letter{
    font-family:var(--pop); font-size:70px; line-height:1;
    color:var(--pink-deep); text-shadow:2px 2px 0 #fff, 4px 4px 0 var(--line);
  }
  .rank .pct{ color:var(--ink-dim); font-weight:800; font-size:14px; margin-top:6px; }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:22px 0; }
  .stat{ background:#fff; border:2px solid var(--line); border-radius:18px; padding:14px; box-shadow:0 3px 0 var(--line); }
  .stat .k{ font-size:11px; color:var(--ink-dim); font-weight:800; }
  .stat .v{ font-family:var(--pop); font-size:22px; margin-top:4px; color:var(--ink); }
  .stat.perfect .v{ color:#e8a800; }
  .stat.good .v{ color:#1e9fdc; }
  .stat.miss .v{ color:#ff5577; }
  .result-actions{ display:flex; flex-direction:column; gap:10px; margin-top:auto; }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:#fff; border:2px solid var(--pink); color:var(--pink-deep); padding:10px 18px;
    font-weight:800; border-radius:20px; font-size:13px; z-index:50; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; box-shadow:0 3px 0 var(--pink);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand">★ Fanchant Trainer ★</div>
    <button class="backbtn" id="btn-home-nav" style="display:none;">← ホーム</button>
  </div>

  <div id="media-slot">
    <div class="player-frame"><div id="yt-player"></div></div>
  </div>

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <h1 class="hero">推しの<em>掛け声</em>を、<br>指に覚えさせる♡</h1>
    <p class="sub">YouTubeの動画を見ながら実際の掛け声のタイミングをタップして記録し、リズムゲーム形式で覚えられるまで練習します。</p>

    <div class="field">
      <label>YouTube動画URL</label>
      <input type="text" id="input-url" placeholder="https://www.youtube.com/watch?v=... または youtu.be/...">
    </div>
    <button class="btn btn-primary" id="btn-new-chart">この動画で新しいコール表を作る</button>

    <div class="divider">保存済みのコール表</div>
    <div class="chartlist" id="chartlist"></div>
  </div>

  <!-- EDITOR -->
  <div class="screen" id="screen-editor">
    <div class="field">
      <label>コール表の名前</label>
      <input type="text" id="editor-name" placeholder="例：曲名 サビ応援">
    </div>
    <div class="field">
      <label>参考リンク（任意）</label>
      <input type="text" id="editor-ref" placeholder="公式サイトの応援方法ページなど">
    </div>

    <div class="transport">
      <button class="iconbtn" id="editor-playpause">▶</button>
      <button class="iconbtn" id="editor-back3">-3s</button>
      <button class="iconbtn" id="editor-fwd3">+3s</button>
      <select class="rate-select" id="editor-rate">
        <option value="1">1.0x</option>
        <option value="0.75">0.75x</option>
        <option value="0.5">0.5x</option>
      </select>
    </div>

    <div class="tapzone" id="editor-tap">
      <div>タップして掛け声を登録</div>
      <div class="cnt" id="editor-count">0件 記録済み</div>
    </div>

    <div style="display:flex; gap:8px; margin-top:10px;">
      <button class="btn btn-ghost" id="editor-undo" style="flex:1;">直前を取り消す</button>
    </div>

    <div class="cuelog" id="editor-log"></div>

    <div class="editor-savebar">
      <button class="btn btn-ghost" id="editor-cancel" style="flex:1;">キャンセル</button>
      <button class="btn btn-primary" id="editor-save" style="flex:1;">保存する</button>
    </div>
  </div>

  <!-- PLAY -->
  <div class="screen" id="screen-play">
    <div class="hud">
      <div class="score" id="play-score">0</div>
      <div class="combo">COMBO<br><b id="play-combo">0</b></div>
    </div>
    <div class="hud2">
      <button class="blindtoggle" id="blind-toggle">🙈 ノーツを隠す</button>
    </div>
    <div class="lane" id="lane">
      <div class="hitline"></div>
      <div class="callout" id="callout"></div>
      <div class="startoverlay" id="startoverlay">
        <h2 id="play-title-name">-</h2>
        <button class="bigbtn" id="btn-start-play">START</button>
        <div style="color:var(--ink-dim); font-size:12px; font-weight:700;">タイミングよく下のボタンを押そう</div>
      </div>
    </div>
    <button class="pushbtn" id="pushbtn">PUSH!</button>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div class="rank">
      <div class="letter" id="result-rank">-</div>
      <div class="pct" id="result-pct">-</div>
    </div>
    <div class="stat-grid">
      <div class="stat perfect"><div class="k">Perfect</div><div class="v" id="r-perfect">0</div></div>
      <div class="stat good"><div class="k">Good</div><div class="v" id="r-good">0</div></div>
      <div class="stat"><div class="k">Bad</div><div class="v" id="r-bad">0</div></div>
      <div class="stat miss"><div class="k">Miss</div><div class="v" id="r-miss">0</div></div>
    </div>
    <div class="stat" style="text-align:center;"><div class="k">Max Combo</div><div class="v" id="r-combo">0</div></div>
    <div class="result-actions">
      <button class="btn btn-primary" id="btn-retry">もう一度プレイ</button>
      <button class="btn btn-ghost" id="btn-result-home">ホームに戻る</button>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------- state ---------- */
  const S = {
    screen: 'home',
    ytReady: false,
    ytPlayer: null,
    pendingPlayerAction: null,
    editor: { videoId:null, cues:[], playing:false },
    game: { chart:null, cues:[], idx:0, running:false, rafId:null, score:0, combo:0, maxCombo:0,
            counts:{perfect:0, good:0, bad:0, miss:0}, noteEls:[], blind:false, ended:false },
  };
  const LEAD = 1.15, W_PERFECT = 0.15, W_GOOD = 0.35, W_BAD = 0.6;

  /* ---------- helpers ---------- */
  function $(id){ return document.getElementById(id); }
  function fmtTime(s){
    if (s==null || isNaN(s)) return '0:00.0';
    const m = Math.floor(s/60), r = (s - m*60).toFixed(1);
    return m + ':' + (r.length<4?'0':'') + r;
  }
  function extractVideoId(url){
    if(!url) return null;
    url = url.trim();
    let m = url.match(/[?&]v=([A-Za-z0-9_-]{11})/); if(m) return m[1];
    m = url.match(/youtu\.be\/([A-Za-z0-9_-]{11})/); if(m) return m[1];
    m = url.match(/\/embed\/([A-Za-z0-9_-]{11})/); if(m) return m[1];
    if(/^[A-Za-z0-9_-]{11}$/.test(url)) return url;
    return null;
  }
  let toastTimer=null;
  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
  }
  function showScreen(name){
    document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
    $('screen-'+name).classList.add('active');
    S.screen = name;
    $('btn-home-nav').style.display = name==='home' ? 'none' : 'inline-flex';
    const slot = $('media-slot');
    if(name==='editor' || name==='play'){ slot.classList.add('show'); }
    else { slot.classList.remove('show'); }
  }

  /* ---------- storage (localStorage: works once hosted as a real site) ---------- */
  async function loadIndex(){
    try{
      const v = localStorage.getItem('fct-charts-index');
      return v ? JSON.parse(v) : [];
    }catch(e){ return []; }
  }
  async function saveIndex(list){
    try{ localStorage.setItem('fct-charts-index', JSON.stringify(list)); }
    catch(e){ toast('保存に失敗しました'); }
  }
  async function loadChart(id){
    try{
      const v = localStorage.getItem('fct-chart-'+id);
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  }
  async function saveChart(chart){
    try{
      localStorage.setItem('fct-chart-'+chart.id, JSON.stringify(chart));
      return true;
    }catch(e){ toast('保存に失敗しました'); return false; }
  }
  async function deleteChart(id){
    try{ localStorage.removeItem('fct-chart-'+id); }catch(e){}
    const idx = await loadIndex();
    await saveIndex(idx.filter(c=>c.id!==id));
  }

  /* ---------- youtube iframe api ---------- */
  window.onYouTubeIframeAPIReady = function(){
    S.ytPlayer = new YT.Player('yt-player', {
      height:'100%', width:'100%', videoId:'',
      playerVars:{ playsinline:1, rel:0, modestbranding:1, controls:1, origin: window.location.origin || undefined },
      events:{
        onReady: function(){
          S.ytReady = true;
          if (S.pendingPlayerAction){ S.pendingPlayerAction(); S.pendingPlayerAction = null; }
        },
        onStateChange: function(ev){
          if (ev.data === YT.PlayerState.ENDED){
            if (S.screen==='play' && S.game.running) finishGame();
          }
        }
      }
    });
  };
  (function loadYT(){
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  })();
  function withPlayer(fn){
    if (S.ytReady) fn(); else S.pendingPlayerAction = fn;
  }

  /* ---------- home screen ---------- */
  async function renderChartList(){
    const list = await loadIndex();
    const el = $('chartlist');
    if (!list.length){ el.innerHTML = '<div class="empty">まだコール表がありません。<br>上のURLを入力して作成しましょう。</div>'; return; }
    list.sort((a,b)=> b.createdAt - a.createdAt);
    el.innerHTML = '';
    list.forEach(c=>{
      const row = document.createElement('div');
      row.className = 'chart-card';
      row.innerHTML =
        '<img src="https://i.ytimg.com/vi/'+c.videoId+'/mqdefault.jpg" alt="">' +
        '<div class="chart-meta"><div class="name"></div><div class="info"></div></div>' +
        '<div class="chart-actions">' +
          (c.refUrl ? '<button class="iconbtn ref-b" title="参考リンクを開く">🔗</button>' : '') +
          '<button class="iconbtn play-b" title="プレイ">▶</button>' +
          '<button class="iconbtn danger del-b" title="削除">✕</button>' +
        '</div>';
      row.querySelector('.name').textContent = c.name;
      row.querySelector('.info').textContent = c.cueCount + '件のコール';
      row.querySelector('.play-b').addEventListener('click', ()=> startPlayFlow(c.id));
      const refBtn = row.querySelector('.ref-b');
      if (refBtn) refBtn.addEventListener('click', ()=> window.open(c.refUrl, '_blank', 'noopener'));
      row.querySelector('.del-b').addEventListener('click', async ()=>{
        if (confirm('「'+c.name+'」を削除しますか？')){ await deleteChart(c.id); renderChartList(); }
      });
      el.appendChild(row);
    });
  }

  $('btn-new-chart').addEventListener('click', ()=>{
    const id = extractVideoId($('input-url').value);
    if (!id){ toast('YouTubeのURLを確認してください'); return; }
    openEditor(id);
  });

  $('btn-home-nav').addEventListener('click', ()=>{
    stopEditorPlayback();
    stopGameLoop();
    showScreen('home');
    renderChartList();
  });

  /* ---------- editor ---------- */
  function openEditor(videoId){
    S.editor.videoId = videoId;
    S.editor.cues = [];
    S.editor.playing = false;
    $('editor-name').value = '';
    $('editor-ref').value = '';
    $('editor-rate').value = '1';
    renderEditorLog();
    showScreen('editor');
    withPlayer(()=>{
      S.ytPlayer.loadVideoById(videoId);
      S.ytPlayer.pauseVideo();
      S.ytPlayer.setPlaybackRate(1);
    });
    $('editor-playpause').textContent = '▶';
  }
  function stopEditorPlayback(){
    if (S.ytReady && S.ytPlayer && S.ytPlayer.pauseVideo){ try{ S.ytPlayer.pauseVideo(); }catch(e){} }
  }
  $('editor-playpause').addEventListener('click', ()=>{
    withPlayer(()=>{
      if (S.editor.playing){ S.ytPlayer.pauseVideo(); S.editor.playing=false; $('editor-playpause').textContent='▶'; }
      else{ S.ytPlayer.playVideo(); S.editor.playing=true; $('editor-playpause').textContent='❚❚'; }
    });
  });
  $('editor-back3').addEventListener('click', ()=>{
    withPlayer(()=>{
      const t = Math.max(0, S.ytPlayer.getCurrentTime()-3);
      S.ytPlayer.seekTo(t, true);
    });
  });
  $('editor-fwd3').addEventListener('click', ()=>{
    withPlayer(()=>{
      const dur = S.ytPlayer.getDuration ? S.ytPlayer.getDuration() : Infinity;
      const t = Math.min(dur||Infinity, S.ytPlayer.getCurrentTime()+3);
      S.ytPlayer.seekTo(t, true);
    });
  });
  $('editor-rate').addEventListener('change', (e)=>{
    withPlayer(()=> S.ytPlayer.setPlaybackRate(parseFloat(e.target.value)));
  });
  $('editor-tap').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    if (!S.ytReady || !S.editor.playing) { toast('再生してからタップしてください'); return; }
    const t = S.ytPlayer.getCurrentTime();
    S.editor.cues.push(t);
    const zone = $('editor-tap');
    zone.classList.remove('flash'); void zone.offsetWidth; zone.classList.add('flash');
    renderEditorLog();
  });
  $('editor-undo').addEventListener('click', ()=>{
    S.editor.cues.pop();
    renderEditorLog();
  });
  function renderEditorLog(){
    $('editor-count').textContent = S.editor.cues.length + '件 記録済み';
    const log = $('editor-log');
    log.innerHTML = '';
    S.editor.cues.forEach((t, i)=>{
      const row = document.createElement('div');
      row.className = 'cuelog-row';
      row.innerHTML = '<span>#'+(i+1)+'　'+fmtTime(t)+'</span><button>✕</button>';
      row.querySelector('button').addEventListener('click', ()=>{
        S.editor.cues.splice(i,1); renderEditorLog();
      });
      log.appendChild(row);
    });
  }
  $('editor-cancel').addEventListener('click', ()=>{
    stopEditorPlayback();
    showScreen('home'); renderChartList();
  });
  $('editor-save').addEventListener('click', async ()=>{
    const name = $('editor-name').value.trim();
    if (!name){ toast('コール表の名前を入力してください'); return; }
    if (S.editor.cues.length < 1){ toast('コールを1件以上記録してください'); return; }
    stopEditorPlayback();
    const cues = S.editor.cues.slice().sort((a,b)=>a-b);
    const refUrl = $('editor-ref').value.trim();
    const chart = {
      id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      name, videoId: S.editor.videoId, cues, refUrl, createdAt: Date.now()
    };
    const ok = await saveChart(chart);
    if (!ok) return;
    const idx = await loadIndex();
    idx.push({ id:chart.id, name:chart.name, videoId:chart.videoId, cueCount:cues.length, refUrl, createdAt:chart.createdAt });
    await saveIndex(idx);
    toast('保存しました');
    showScreen('home'); renderChartList();
  });

  /* ---------- play (game) ---------- */
  async function startPlayFlow(chartId){
    const chart = await loadChart(chartId);
    if (!chart){ toast('コール表が読み込めませんでした'); return; }
    S.game.chart = chart;
    S.game.cues = chart.cues.map(t=>({time:t, judged:false, el:null}));
    S.game.idx = 0; S.game.score = 0; S.game.combo = 0; S.game.maxCombo = 0;
    S.game.counts = {perfect:0, good:0, bad:0, miss:0};
    S.game.running = false;
    S.game.ended = false;
    $('play-title-name').textContent = chart.name;
    $('play-score').textContent = '0';
    $('play-combo').textContent = '0';
    $('startoverlay').style.display = 'flex';
    const lane = $('lane');
    lane.querySelectorAll('.note').forEach(n=>n.remove());
    S.game.cues.forEach((cue)=>{
      const el = document.createElement('div');
      el.className = 'note';
      lane.appendChild(el);
      cue.el = el;
    });
    showScreen('play');
    withPlayer(()=>{
      S.ytPlayer.loadVideoById(chart.videoId);
      S.ytPlayer.pauseVideo();
    });
  }
  $('btn-start-play').addEventListener('click', ()=>{
    $('startoverlay').style.display = 'none';
    withPlayer(()=>{
      S.ytPlayer.seekTo(0, true);
      S.ytPlayer.playVideo();
      S.game.running = true;
      runGameLoop();
    });
  });
  $('blind-toggle').addEventListener('click', ()=>{
    S.game.blind = !S.game.blind;
    $('lane').classList.toggle('blind-mode', S.game.blind);
    $('blind-toggle').classList.toggle('active', S.game.blind);
    $('blind-toggle').textContent = S.game.blind ? '🙉 ノーツを表示' : '🙈 ノーツを隠す';
  });
  function showCallout(text, cls){
    const c = $('callout');
    c.textContent = text; c.className = 'callout show ' + cls;
    void c.offsetWidth;
  }
  function judgeCue(cue, pressTime){
    if (cue.judged) return;
    cue.judged = true;
    let cls, label;
    if (pressTime === null){
      cls='judge-miss'; label='MISS'; S.game.counts.miss++; S.game.combo=0;
    } else {
      const d = Math.abs(pressTime - cue.time);
      if (d<=W_PERFECT){ cls='judge-perfect'; label='PERFECT'; S.game.score+=100; S.game.combo++; S.game.counts.perfect++; }
      else if (d<=W_GOOD){ cls='judge-good'; label='GOOD'; S.game.score+=50; S.game.combo++; S.game.counts.good++; }
      else { cls='judge-bad'; label='BAD'; S.game.score+=10; S.game.combo=0; S.game.counts.bad++; }
    }
    S.game.maxCombo = Math.max(S.game.maxCombo, S.game.combo);
    cue.el.classList.add(cls);
    showCallout(label, cls.replace('judge-','c-'));
    $('play-score').textContent = S.game.score;
    $('play-combo').textContent = S.game.combo;
  }
  function runGameLoop(){
    function tick(){
      if (!S.game.running) return;
      const t = S.ytPlayer.getCurrentTime ? S.ytPlayer.getCurrentTime() : 0;
      S.game.cues.forEach(cue=>{
        if (cue.judged) return;
        const dt = cue.time - t;
        if (dt > LEAD){ cue.el.classList.remove('visible'); return; }
        if (dt < -W_BAD - 0.3){ judgeCue(cue, null); return; }
        cue.el.classList.add('visible');
        const progress = 1 - (dt/LEAD);
        const topPct = Math.min(progress, 1.15) * 82;
        cue.el.style.top = topPct + '%';
      });
      // keep playing through to the end of the video even after all cues are judged
      S.game.rafId = requestAnimationFrame(tick);
    }
    S.game.rafId = requestAnimationFrame(tick);
  }
  function stopGameLoop(){
    S.game.running = false;
    if (S.game.rafId) cancelAnimationFrame(S.game.rafId);
    if (S.ytReady && S.ytPlayer && S.ytPlayer.pauseVideo){ try{ S.ytPlayer.pauseVideo(); }catch(e){} }
  }
  function pressHit(){
    if (!S.game.running) return;
    const t = S.ytPlayer.getCurrentTime();
    let best=null, bestDelta=Infinity;
    S.game.cues.forEach(cue=>{
      if (cue.judged) return;
      const d = Math.abs(cue.time - t);
      if (d<bestDelta){ bestDelta=d; best=cue; }
    });
    if (best && bestDelta<=W_BAD){ judgeCue(best, t); }
    else { showCallout('...', 'c-bad'); }
  }
  $('pushbtn').addEventListener('pointerdown', (e)=>{ e.preventDefault(); pressHit(); });
  window.addEventListener('keydown', (e)=>{
    if (e.code==='Space' && S.screen==='play' && S.game.running){ e.preventDefault(); pressHit(); }
  });
  function finishGame(){
    if (S.game.ended) return;
    S.game.ended = true;
    // auto-miss any cues that never got judged
    S.game.cues.forEach(cue=>{ if(!cue.judged) judgeCue(cue, null); });
    stopGameLoop();
    const total = S.game.cues.length;
    const maxScore = total*100;
    const pct = maxScore>0 ? Math.round((S.game.score/maxScore)*1000)/10 : 0;
    let rank='C';
    if (pct>=98) rank='S'; else if (pct>=90) rank='A'; else if (pct>=75) rank='B';
    $('result-rank').textContent = rank;
    $('result-pct').textContent = pct + '%  ('+S.game.score+' / '+maxScore+')';
    $('r-perfect').textContent = S.game.counts.perfect;
    $('r-good').textContent = S.game.counts.good;
    $('r-bad').textContent = S.game.counts.bad;
    $('r-miss').textContent = S.game.counts.miss;
    $('r-combo').textContent = S.game.maxCombo;
    showScreen('result');
  }
  $('btn-retry').addEventListener('click', ()=>{ startPlayFlow(S.game.chart.id); });
  $('btn-result-home').addEventListener('click', ()=>{ showScreen('home'); renderChartList(); });

  /* ---------- init ---------- */
  renderChartList();
})();
</script>
</body>
</html>
